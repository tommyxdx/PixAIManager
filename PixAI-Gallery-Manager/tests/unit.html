<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGM unit tests</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #111; color: #ddd; }
  #result { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .pass { color: #4ade80; }
  .fail { color: #f87171; }
  li { margin: 2px 0; }
  .err { color: #fca5a5; white-space: pre-wrap; margin-left: 1em; }
</style>

<body>
<div id="result">running…</div>
<ul id="list"></ul>

<script>
  // In-memory chrome.storage for settings.js and folders.js. No network is touched by these tests:
  // API tests replace fetch with a fake.
  (function () {
    const data = new Map();
    const listeners = [];
    const clone = (v) => (v === undefined ? undefined : structuredClone(v));
    function keyList(keys) {
      if (keys == null) return [...data.keys()];
      if (typeof keys === "string") return [keys];
      return Array.isArray(keys) ? keys : Object.keys(keys);
    }
    globalThis.chrome = {
      runtime: { id: "unit" },
      storage: {
        local: {
          async get(keys) {
            const out = {};
            for (const k of keyList(keys)) if (data.has(k)) out[k] = clone(data.get(k));
            return out;
          },
          async set(obj) {
            const changes = {};
            for (const [k, v] of Object.entries(obj)) {
              changes[k] = { oldValue: clone(data.get(k)), newValue: clone(v) };
              data.set(k, clone(v));
            }
            listeners.forEach((fn) => fn(changes, "local"));
          },
          async remove(keys) {
            for (const k of keyList(keys)) data.delete(k);
          },
          async clear() {
            data.clear();
          }
        },
        onChanged: {
          addListener: (fn) => listeners.push(fn),
          removeListener: (fn) => listeners.splice(listeners.indexOf(fn) >>> 0, 1)
        }
      }
    };
  })();
</script>
<script>
  // Load the scripts with a cache-buster so edits show up on reload, then run the tests.
  document.write(["ns", "i18n", "naming", "queue", "settings", "api", "folders", "zip", "packer", "convert"]
    .map((n) => '<script src="../src/' + n + '.js?v=' + Date.now() + '"><\/script>').join(""));
</script>
<script>
(function () {
  "use strict";
  const tests = [];
  const test = (name, fn) => tests.push({ name, fn });
  const N = PGM.naming;
  const Q = PGM.queue;
  const U = PGM.util;
  const A = PGM.api;
  const F = PGM.folders;
  const TOKEN_KEY = "https://api.pixai.art:token";
  PGM.i18n.lang = "zh"; // the expected names below are the Chinese defaults, whatever the browser language

  function eq(actual, expected, msg) {
    const a = JSON.stringify(actual);
    const b = JSON.stringify(expected);
    if (a !== b) throw new Error((msg ? msg + ": " : "") + "expected " + b + ", got " + a);
  }
  function ok(value, msg) {
    if (!value) throw new Error(msg || "expected a truthy value");
  }
  async function rejects(promise, code) {
    try {
      await promise;
    } catch (e) {
      if (code && e.code !== code) throw new Error("expected code " + code + ", got " + (e.code || e.message));
      return;
    }
    throw new Error("expected a rejection" + (code ? " with " + code : ""));
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Replaces fetch for one test. The API base points at a closed local port, so a missed stub
  // can never reach a real server.
  async function withFetch(handler, fn) {
    const calls = [];
    const originalFetch = globalThis.fetch;
    const originalBase = globalThis.PGM_TEST_API_BASE;
    globalThis.PGM_TEST_API_BASE = "http://127.0.0.1:1";
    globalThis.fetch = async (url, init) => {
      const call = { url: new URL(String(url)), init: init || {}, body: init && init.body ? JSON.parse(init.body) : undefined };
      calls.push(call);
      const r = await handler(call, calls.length);
      if (r instanceof Error) throw r;
      return new Response(r.body === undefined ? "" : JSON.stringify(r.body), { status: r.status || 200, headers: r.headers || {} });
    };
    try {
      await fn(calls);
    } finally {
      globalThis.fetch = originalFetch;
      if (originalBase === undefined) delete globalThis.PGM_TEST_API_BASE;
      else globalThis.PGM_TEST_API_BASE = originalBase;
    }
  }

  const T = new Date(2026, 10, 3, 14, 5, 9).toISOString(); // local 2026-11-03 14:05:09
  const P1 = "masterpiece, best quality, 1girl, silver hair, (smile:1.2), <lora:abc:0.7>";
  const img = (extra) => Object.assign({ source: "task", taskId: "111", artworkId: null, mediaId: "222",
    index: 1, count: 1, ext: "png", createdAt: T, prompt: P1, url: "https://images-ng.pixai.art/images/orig/a" }, extra);
  const builtPaths = [];
  const path = (image, opts) => {
    const p = N.buildPath(image, Object.assign({ settings: {} }, opts));
    builtPaths.push(p);
    return p;
  };

  // ---- naming: EXT_SPEC section 3 examples -----------------------------------

  test("example: folder 风景", () => {
    eq(path(img(), { folderName: "风景" }), "PixAI/风景/风景_20261103-140509_1girl_silver-hair_smile.png");
  });
  test("example: no folder, 4 images, index 2", () => {
    eq(path(img({ index: 2, count: 4 })), "PixAI/生成记录/20261103-140509_1girl_silver-hair_smile_2.png");
  });
  test("example: natural language prompt", () => {
    const p = "A girl holding flowers in a sunny garden";
    eq(N.promptTags(p, { count: 3 }).join("_"), "A_girl_holding");
    eq(path(img({ prompt: p })), "PixAI/生成记录/20261103-140509_A_girl_holding.png");
  });
  test("example: CON and a<b>:c*? sanitized", () => {
    eq(N.sanitize("CON"), "_CON");
    eq(N.sanitize("a<b>:c*?"), "a-b-c");
    eq(path(img(), { folderName: "CON" }).split("/")[1], "_CON");
    eq(path(img(), { folderName: "a<b>:c*?" }), "PixAI/a-b-c/a-b-c_20261103-140509_1girl_silver-hair_smile.png");
  });

  // ---- naming: edge cases ------------------------------------------------------

  test("empty prompt", () => {
    eq(N.promptTags(""), []);
    eq(N.promptTags(null), []);
    eq(path(img({ prompt: "" })), "PixAI/生成记录/20261103-140509.png");
  });
  test("only quality tags", () => {
    eq(N.promptTags("masterpiece, best quality, highres, absurdres, 8k, very aesthetic, year_2024, Year 2025"), []);
    eq(path(img({ prompt: "masterpiece, best_quality" }), { folderName: "x" }), "PixAI/x/x_20261103-140509.png");
  });
  test("CJK tags and separators", () => {
    eq(N.promptTags("女孩，银发、微笑；樱花"), ["女孩", "银发", "微笑"]);
    eq(N.promptTags("女孩\n银发;微笑", { count: 5 }), ["女孩", "银发", "微笑"]);
  });
  test("200-char prompt stays within 120 chars", () => {
    const long = Array.from({ length: 12 }, (_, i) => "longtag" + i + " extra words here").join(", ");
    ok(long.length >= 200, "prompt is long");
    const p = path(img({ prompt: long }), { folderName: "风景", settings: { promptCount: 5 } });
    const base = p.split("/").pop().replace(/\.png$/, "");
    ok(Array.from(base).length <= 120, "base too long: " + base.length);
    ok(base.startsWith("风景_20261103-140509_longtag0"), base);
    const hard = path(img(), { settings: { template: "x".repeat(200) + "_{time}" } });
    eq(Array.from(hard.split("/").pop().replace(/\.png$/, "")).length, 120);
  });
  test("reserved names and sanitize rules", () => {
    eq(N.sanitize("lpt1"), "_lpt1");
    eq(N.sanitize("com3.txt"), "_com3.txt");
    eq(N.sanitize("nul"), "_nul");
    eq(N.sanitize("CONSOLE"), "CONSOLE");
    eq(N.sanitize("  ..name..  "), "name");
    eq(N.sanitize("文件/名"), "文件-名");
    eq(N.sanitize("a\u0000b\u202ec"), "a-b-c");
    eq(N.sanitize("___x___"), "x");
    eq(N.sanitize("a---b"), "a-b");
    eq(N.sanitize(undefined), "");
  });
  test("prompt cleanup: weights, brackets, lora, score, BREAK, @image", () => {
    eq(N.promptTags("(masterpiece:1.2), [detailed], {best quality}, (red eyes:1.3), \\(artist\\)", { count: 5 }), ["red-eyes", "artist"]);
    eq(N.promptTags("score_9, score_8_up, score_7_up, 1girl"), ["1girl"]);
    eq(N.promptTags("@image1 girl, BREAK, smile"), ["girl", "smile"]);
    eq(N.promptTags("<lora:a:0.5> <embedding:b>, cat"), ["cat"]);
    eq(N.promptTags("(a, b:1.1), c"), ["a", "b", "c"]);
  });
  test("tag shaping: underscores, spaces, 24 chars, count, dedupe", () => {
    eq(N.promptTags("silver_hair, very  long   hair"), ["silver-hair", "very-long-hair"]);
    eq(N.promptTags("a".repeat(40)), ["a".repeat(24)]);
    eq(N.promptTags("1girl, solo, smile", { count: 2 }), ["1girl", "solo"]);
    eq(N.promptTags("masterpiece, 1girl", { skipQuality: false }), ["masterpiece", "1girl"]);
    eq(N.promptTags("1girl, 1girl, smile"), ["1girl", "smile"]);
    eq(N.promptTags("red apple on table"), ["red-apple-on-table"]);
  });
  test("formatTime", () => {
    eq(N.formatTime("nope"), "unknown-time");
    eq(N.formatTime(null), "unknown-time");
    eq(N.formatTime(""), "unknown-time");
    eq(N.formatTime(new Date(2026, 0, 2, 3, 4, 5)), "20260102-030405");
    eq(N.formatTime(T), "20261103-140509");
  });
  test("templates, directories and extensions", () => {
    eq(path(img({ index: 2, count: 4 }), { settings: { template: "{time}_{index}" } }), "PixAI/生成记录/20261103-140509_2.png");
    eq(path(img({ prompt: "" }), { settings: { template: "{prompt}" } }), "PixAI/生成记录/111_222.png");
    eq(path(img(), { settings: { template: "{folder}-{time}" } }), "PixAI/生成记录/20261103-140509.png");
    eq(path(img(), { settings: { template: "{foo}_{time}" } }), "PixAI/生成记录/{foo}_20261103-140509.png");
    eq(path(img(), { folderName: "风景", settings: { directory: "../evil/{folder}", template: "{time}" } }), "evil/风景/20261103-140509.png");
    eq(path(img(), { folderName: "风景", settings: { directory: "", template: "{time}" } }), "20261103-140509.png");
    const win = path(img(), { folderName: "风景", settings: { directory: "C:\\Users\\{folder}", template: "{time}" } });
    ok(!/^[a-z]:/i.test(win) && Q.isSafePath(win), win);
    eq(path(img({ ext: "webp" }), { settings: { template: "{time}" } }), "PixAI/生成记录/20261103-140509.webp");
    eq(path(img({ ext: "exe;" }), { settings: { template: "{time}" } }), "PixAI/生成记录/20261103-140509.png");
    eq(path(img({ ext: "", isVideo: true }), { settings: { template: "{time}" } }), "PixAI/生成记录/20261103-140509.mp4");
    eq(path(img({ source: "artwork", taskId: null, artworkId: "333", mediaId: "444" }), { settings: { template: "{task}_{media}" } }), "PixAI/生成记录/333_444.png");
    eq(path(img(), { folderName: "a/b", settings: { template: "{time}" } }), "PixAI/a-b/20261103-140509.png");
  });
  test("example() helper", () => {
    ok(/^PixAI\/风景\/风景_\d{8}-\d{6}_1girl_silver-hair_smile_2\.png$/.test(N.example({}, "风景")), N.example({}, "风景"));
  });

  // ---- queue -----------------------------------------------------------------

  test("queue respects concurrency", async () => {
    let inflight = 0;
    let max = 0;
    let progress = 0;
    const q = Q.createQueue({
      concurrency: 3,
      run: async () => {
        inflight++;
        max = Math.max(max, inflight);
        await sleep(10);
        inflight--;
      },
      onProgress: () => progress++
    });
    const r = await q.start(Array.from({ length: 10 }, (_, i) => ({ i })));
    eq([r.done, r.failed.length, r.total, r.cancelled, max, progress], [10, 0, 10, false, 3, 10]);
  });
  test("queue records failures and keeps going", async () => {
    const q = Q.createQueue({
      concurrency: 2,
      run: async (e) => {
        await sleep(1);
        if (e.fail === "code") throw new PGM.PGMError(0, "BAD_URL", "x");
        if (e.fail) throw new Error("boom");
      }
    });
    const r = await q.start([{}, { fail: true }, {}, { fail: "code" }, {}]);
    eq([r.done, r.failed.map((f) => f.error)], [3, ["boom", "BAD_URL"]]);
  });
  test("queue cancel stops new entries", async () => {
    let started = 0;
    const q = Q.createQueue({
      concurrency: 2,
      run: async () => {
        started++;
        await sleep(5);
      },
      onProgress: (p) => {
        if (p.done === 4) q.cancel();
      }
    });
    const r = await q.start(Array.from({ length: 20 }, () => ({})));
    ok(r.cancelled, "cancelled flag");
    ok(r.done >= 4 && r.done <= 6, "done " + r.done);
    ok(started < 20, "started " + started);
  });
  test("queue with no entries, and single start", async () => {
    const q = Q.createQueue({ concurrency: 3, run: async () => {} });
    eq(await q.start([]), { done: 0, failed: [], total: 0, cancelled: false });
    await rejects(q.start([{}]));
  });

  // ---- chunking, URL and path validation -------------------------------------

  test("chunk helper", () => {
    eq(U.chunk(Array.from({ length: 120 }, (_, i) => i), 50).map((c) => c.length), [50, 50, 20]);
    eq(U.chunk([], 50), []);
    eq(U.chunk([1, 2, 3], 0), [[1], [2], [3]]);
  });
  test("URL host validation", () => {
    ok(U.isAllowedUrl("https://images-ng.pixai.art/images/orig/x"));
    ok(U.isAllowedUrl("https://cdn.pixai.art/a.png"));
    ok(U.isAllowedUrl("https://api.pixai.art/v1/media/1/image"));
    for (const bad of [
      "http://images-ng.pixai.art/x",
      "https://images-ng.pixai.art.evil.com/x",
      "https://evil.com/?u=https://images-ng.pixai.art/",
      "https://user:pw@images-ng.pixai.art/x",
      "https://images-ng.pixai.art:8443/x",
      "https://pixai.art/x",
      "javascript:alert(1)",
      "data:image/png;base64,AAAA",
      "",
      null
    ]) ok(!U.isAllowedUrl(bad), "should reject " + bad);
  });
  test("URL validation in test mode", () => {
    const before = globalThis.PGM_TEST_API_BASE;
    globalThis.PGM_TEST_API_BASE = "http://127.0.0.1:18765";
    try {
      ok(U.isAllowedUrl("http://127.0.0.1:18765/img/1.png"));
      ok(!U.isAllowedUrl("http://127.0.0.1:9999/img/1.png"));
    } finally {
      if (before === undefined) delete globalThis.PGM_TEST_API_BASE;
      else globalThis.PGM_TEST_API_BASE = before;
    }
    ok(!U.isAllowedUrl("http://127.0.0.1:18765/img/1.png"));
  });
  test("path validation", () => {
    ok(Q.isSafePath("PixAI/风景/a_b.png"));
    for (const bad of ["/abs.png", "../x.png", "a/../b.png", "a/./b.png", "C:/x.png", "a\\b.png", "a//b.png",
      "CON.png", "a/b./c.png", "a/ b/c.png", "", null, "x".repeat(401)]) ok(!Q.isSafePath(bad), "should reject " + bad);
    eq(Q.checkEntry({ url: "https://images-ng.pixai.art/x", path: "a/b.png" }), null);
    eq(Q.checkEntry({ url: "https://evil.com/x", path: "a/b.png" }), "BAD_URL");
    eq(Q.checkEntry({ url: "https://images-ng.pixai.art/x", path: "../b.png" }), "BAD_PATH");
  });
  test("every built path is safe", () => {
    ok(builtPaths.length > 10, "paths collected");
    for (const p of builtPaths) ok(Q.isSafePath(p), "unsafe: " + p);
  });

  // ---- i18n ------------------------------------------------------------------

  test("i18n lookup, vars and fallbacks", () => {
    const lang = PGM.i18n.lang;
    try {
      PGM.i18n.lang = "zh";
      eq(PGM.t("delete.title", { n: 5 }), "永久删除 5 张图片？");
      eq(PGM.t("delete.summary", { a: 3, p: 1, f: 0 }), "已删除 3 张，跳过 1 张已发布，失败 0 张");
      ok(PGM.t("settings.templateHelp").includes("{folder}"), "literal tokens survive");
      eq(PGM.t("no.such.key"), "no.such.key");
      eq(PGM.t.error({ code: "LOGIN_REQUIRED" }), "请先登录 pixai.art");
      eq(PGM.t.error({ code: "HTTP_502", status: 502 }), "请求失败（HTTP 502）");
      PGM.i18n.add("zh", { "unit.only": "仅中文" });
      PGM.i18n.lang = "en";
      eq(PGM.t("unit.only"), "仅中文");
      eq(PGM.t("delete.ack"), "I understand deleted images cannot be recovered");
      PGM.i18n.add({ en: { "unit.only": "English" } });
      eq(PGM.t("unit.only"), "English");
      ok(Object.keys(PGM.strings.zh).every((k) => k in PGM.strings.en), "every zh key has an en translation");
    } finally {
      PGM.i18n.lang = lang;
    }
  });

  // ---- settings --------------------------------------------------------------

  test("settings normalize, set and get", async () => {
    const n = PGM.settings.normalize({ promptCount: 7, concurrency: 9, pageSize: 500, template: "", noFolderName: "a/b", skipQuality: "no" });
    eq([n.promptCount, n.concurrency, n.pageSize, n.template, n.noFolderName, n.skipQuality], [3, 3, 50, "{folder}_{time}_{prompt}", "a-b", true]);
    eq((await PGM.settings.get()).pageSize, 50);
    await PGM.settings.set({ promptCount: 4 });
    eq((await PGM.settings.get()).promptCount, 4);
    eq(PGM.settings.current().promptCount, 4);
    await PGM.settings.reset();
    eq((await PGM.settings.get()).promptCount, 3);
  });

  // ---- API normalization -----------------------------------------------------

  test("normalizeTask: images, favorites, published, urls", () => {
    const row = {
      id: "10", status: "completed", createdAt: "2026-11-01T00:00:00.000Z", imageType: "webp", artworkCount: 1,
      outputs: { mediaIds: ["1", "2", "3"], mediaUrls: ["https://images-ng.pixai.art/gi/orig/a", null, "https://evil.com/x.png"] },
      parameters: { prompts: "p" },
      bookmarkState: { favoritedAt: "x", mediaItems: [{ mediaId: "2", favoritedAt: null }] }
    };
    const out = A.normalizeTask(row);
    eq(out.map((i) => [i.key, i.index, i.count, i.ext, i.favorited, i.published, i.url]), [
      ["task:10:1", 1, 3, "webp", true, true, "https://images-ng.pixai.art/gi/orig/a"],
      ["task:10:2", 2, 3, "webp", false, true, ""],
      ["task:10:3", 3, 3, "webp", true, true, ""]
    ]);
    eq(Object.keys(out[0]).sort(), ["artworkId", "count", "createdAt", "ext", "favorited", "index", "isVideo", "key",
      "mediaId", "prompt", "published", "source", "taskId", "thumb", "url"]);
    eq(A.normalizeTask({ ...row, status: "failed" }), []);
  });
  test("normalizeTask: prompt fallbacks and video", () => {
    const base = { id: "7", status: "completed", outputs: { mediaIds: ["1"], mediaUrls: [null] } };
    eq(A.normalizeTask({ ...base, parameters: { chat: { prompts: "chat p" } } })[0].prompt, "chat p");
    eq(A.normalizeTask({ ...base, prompts: "preview" })[0].prompt, "preview");
    eq(A.normalizeTask(base)[0].prompt, "");
    eq(A.normalizeTask({ ...base, isPublished: true })[0].published, true);
    const v = A.normalizeTask({ ...base, bookmarkState: { favoritedAt: "y", mediaItems: [] },
      outputs: { mediaIds: ["5"], mediaUrls: [null], videoMediaId: "9" } });
    eq(v.map((i) => [i.key, i.isVideo, i.ext, i.favorited, i.count]), [["task:7:9", true, "mp4", true, 1]]);
  });
  test("normalizeArtworkItem", () => {
    const row = { refType: "artwork", effectiveStatus: "available", artwork: { id: "30", mediaId: "40", prompts: "p",
      createdAt: "2026-10-01T00:00:00.000Z", videoMediaId: null,
      media: { publicUrl: "https://images-ng.pixai.art/images/orig/u", thumbnailUrl: "https://images-ng.pixai.art/images/thumb/u" } } };
    const i = A.normalizeArtworkItem(row);
    eq([i.key, i.source, i.taskId, i.artworkId, i.published, i.ext, i.thumb],
      ["artwork:30:40", "artwork", null, "30", true, "png", "https://images-ng.pixai.art/images/thumb/u"]);
    eq(A.normalizeArtworkItem({ ...row, effectiveStatus: "unavailable" }), null);
    eq(A.normalizeArtworkItem({ ...row, artwork: null }), null);
    eq(A.normalizeArtworkItem({ ...row, refType: "model" }), null);
  });
  test("queryString and imageExt", () => {
    eq(A.queryString({ ids: ["1", "2"], favorited: "true", empty: "", none: undefined, n: 5, b: true }),
      "?ids[0]=1&ids[1]=2&favorited=true&n=5&b=true");
    eq(A.queryString({}), "");
    eq([A.imageExt("image/webp"), A.imageExt("png"), A.imageExt(null, "animate"), A.imageExt("jpeg"), A.imageExt(undefined)],
      ["webp", "png", "webp", "jpg", "png"]);
  });

  // ---- API requests (fake fetch) ---------------------------------------------

  test("request: auth header, errors, route guard, token rotation", async () => {
    localStorage.setItem(TOKEN_KEY, "unit.token.a");
    try {
      await withFetch((call) => {
        const p = call.url.pathname;
        if (p === "/v2/user/me") return { body: { id: 5, username: "u", displayName: "" }, headers: { token: "unit.token.b" } };
        if (p === "/v2/task/search") return { status: 400, body: { code: "BAD_REQUEST", message: "bad" } };
        if (p === "/v2/task/123") return { status: 401, body: { code: "UNAUTHORIZED" } };
        return new TypeError("Failed to fetch");
      }, async (calls) => {
        eq(await A.me(), { id: "5", name: "u" });
        eq(calls[0].init.headers.Authorization, "Bearer unit.token.a");
        eq(calls[0].init.credentials, "include");
        eq(localStorage.getItem(TOKEN_KEY), "unit.token.b");
        await rejects(A.get("/task/search", { first: 1 }), "BAD_REQUEST");
        await rejects(A.get("/task/123"), "LOGIN_REQUIRED");
        await rejects(A.get("/collection/list/1"), "NETWORK");

  const Z = PGM.zip;
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  // Reads an archive the way unzip tools do: from the end record through the central directory.
  async function readZip(blob) {
    const buf = new Uint8Array(await blob.arrayBuffer());
    const v = new DataView(buf.buffer);
    const end = buf.length - 22;
    eq(v.getUint32(end, true), 0x06054b50, "end record");
    const count = v.getUint16(end + 10, true);
    const cdSize = v.getUint32(end + 12, true);
    const cdOff = v.getUint32(end + 16, true);
    eq(cdOff + cdSize, end, "directory ends at the end record");
    const files = [];
    let p = cdOff;
    for (let i = 0; i < count; i++) {
      eq(v.getUint32(p, true), 0x02014b50, "central header");
      const flags = v.getUint16(p + 8, true);
      const method = v.getUint16(p + 10, true);
      const time = v.getUint16(p + 12, true);
      const date = v.getUint16(p + 14, true);
      const crc = v.getUint32(p + 16, true);
      const size = v.getUint32(p + 20, true);
      eq(v.getUint32(p + 24, true), size, "stored: sizes equal");
      const nlen = v.getUint16(p + 28, true);
      const elen = v.getUint16(p + 30, true);
      const clen = v.getUint16(p + 32, true);
      const off = v.getUint32(p + 42, true);
      const name = dec.decode(buf.subarray(p + 46, p + 46 + nlen));
      eq(v.getUint32(off, true), 0x04034b50, "local header of " + name);
      eq(v.getUint32(off + 14, true), crc, "local crc of " + name);
      const lnlen = v.getUint16(off + 26, true);
      const lelen = v.getUint16(off + 28, true);
      eq(dec.decode(buf.subarray(off + 30, off + 30 + lnlen)), name, "local name");
      const start = off + 30 + lnlen + lelen;
      const data = buf.subarray(start, start + size);
      eq(Z.crc32(data), crc, "crc of " + name);
      files.push({ name, flags, method, time, date, data, text: dec.decode(data) });
      p += 46 + nlen + elen + clen;
    }
    eq(p, end, "directory walked to the end");
    return files;
  }

    const result = await PGM.packer.run(Object.assign({ label: "下载：测试", baseName: "PixAI_测试_20261103-140509", concurrency: 1, partBytes: 1e9 }, job), {
      signal: o.signal,
      sleep: async () => {},
      now: () => new Date(2026, 10, 3, 14, 5, 9),
      fetchFile: async (url, signal) => {
        calls[url] = (calls[url] || 0) + 1;
        return o.fetch(url, calls[url], signal);
      },
      save: async (blob, name) => {
        if (o.save) await o.save(blob, name);
        saves.push({ blob, name });
        return 100 + saves.length;
      },
      onEvent: (e) => events.push(e)
    });
    return { result, saves, events, calls };
  }

  test("packer: one archive with a report; retries only what is worth retrying", async () => {

    const { result, saves, events, calls } = await pack({
      lang: "zh", entries,

    }, {
      fetch: (url, n) => {
        if (url.endsWith("/1") && n < 3) throw codeErr("HTTP_503"); // third try works
        if (url.endsWith("/2")) throw codeErr("HTTP_404"); // never retried
        if (url.endsWith("/3")) throw codeErr("FETCH_FAILED"); // gives up after 3 tries
        return enc.encode("data of " + url);
      }
    });
    const u = (i) => "https://images-ng.pixai.art/x/" + i;
    eq([calls[u(0)], calls[u(1)], calls[u(2)], calls[u(3)]], [1, 3, 1, 3], "attempts per file");
    eq(saves.map((s) => s.name), ["PixAI_测试_20261103-140509.zip"]);
    eq(result.done, 3);
    eq(result.total, 6);
    eq(result.failed.map((f) => [f.index, f.error]).sort(), [[2, "HTTP_404"], [3, "FETCH_FAILED"], [5, "BAD_URL"]]);
    eq(result.zips, [{ name: "PixAI_测试_20261103-140509.zip", id: 101, count: 3 }]);
    const files = await readZip(saves[0].blob);
    eq(files.map((f) => f.name), ["img_0.png", "img_1.png", "img_0 (1).png", "_下载报告.txt"]);
    eq(files[1].text, "data of " + u(1));
    const report = files[3].text;
    eq([...files[3].data.subarray(0, 3)], [0xef, 0xbb, 0xbf], "UTF-8 BOM"); // TextDecoder drops it from .text
    ok(report.startsWith("PixAI 图库管理 · 下载报告\r\n"), "title, CRLF");
    ok(report.includes("任务：下载：测试"), report);
    ok(report.includes("压缩包：PixAI_测试_20261103-140509.zip"), report);
    ok(report.includes("本压缩包：成功 3 个，失败 3 个"), report);
    ok(report.includes("整个任务：共 6 个，成功 3 个，失败 3 个，共 1 个压缩包"), report);
    ok(report.includes("  img_2.png\r\n    原因：请求失败（HTTP 404）\r\n    链接：" + u(2)), report);
    ok(report.includes("原因：图片链接不在允许的域名内"), report);
    ok(report.includes("成功（3）：\r\n  img_0.png\r\n  img_1.png\r\n  img_0 (1).png"), report);
    ok(report.includes("重试失败项"), "retry hint");
    const part = events.find((e) => e.type === "part");
    eq([part.ok, part.id, part.indices], [true, 101, [0, 1, 4]]);
    eq(events.filter((e) => e.type === "progress").length, 5);
  });

  // ---- WebP -> PNG ------------------------------------------------------------

  const C = PGM.convert;
  // RIFF/WEBP container with the given chunks ([tag, payloadBytes]); payloads are not real image data.
  function riff(chunks) {
    const parts = [];
    for (const [tag, payload] of chunks) {
      const body = new Uint8Array(payload);
      const head = new Uint8Array(8);
      head.set([...tag].map((c) => c.charCodeAt(0)), 0);
      new DataView(head.buffer).setUint32(4, body.length, true);
      parts.push(head, body, body.length & 1 ? new Uint8Array(1) : new Uint8Array(0));
    }
    const size = parts.reduce((n, x) => n + x.length, 4);
    const out = new Uint8Array(8 + size);
    out.set(enc.encode("RIFF"), 0);
    new DataView(out.buffer).setUint32(4, size, true);
    out.set(enc.encode("WEBP"), 8);
    let pos = 12;
    for (const x of parts) {
      out.set(x, pos);
      pos += x.length;
    }
    return out;
  }

  test("convert: webpInfo reads lossless, lossy and animated containers", () => {
    eq(C.webpInfo(riff([["VP8L", [1, 2, 3, 4, 5]]])), { webp: true, animated: false, lossless: true });
    eq(C.webpInfo(riff([["VP8 ", [1, 2, 3, 4]]])), { webp: true, animated: false, lossless: false });
    eq(C.webpInfo(riff([["VP8X", [0x02, 0, 0, 0, 0, 0, 0, 0, 0, 0]], ["ANIM", [0, 0, 0, 0, 0, 0]]])).animated, true);
    eq(C.webpInfo(riff([["VP8X", [0x10, 0, 0, 0, 0, 0, 0, 0, 0, 0]], ["ALPH", [1]], ["VP8 ", [1, 2]]])),
      { webp: true, animated: false, lossless: false }, "VP8X with alpha only is still");
    eq(C.webpInfo(new Uint8Array([0x89, 0x50, 0x4e, 0x47, 13, 10, 26, 10, 0, 0, 0, 0, 0, 0, 0, 0])).webp, false);
    eq(C.webpInfo(new Uint8Array(3)).webp, false);
  });

  test("convert: pngName", () => {
    eq([C.pngName("a.webp"), C.pngName("风景_1.WEBP"), C.pngName("noext"), C.pngName("a.b.webp")], ["a.png", "风景_1.png", "noext.png", "a.b.png"]);
  });

  // Decoded RGBA of an encoded image, through the browser's own decoder.
  async function pixels(bytes, type) {
    const bmp = await createImageBitmap(new Blob([bytes], { type }), { colorSpaceConversion: "none", premultiplyAlpha: "none" });
    const c = new OffscreenCanvas(bmp.width, bmp.height);
    const ctx = c.getContext("2d");
    ctx.drawImage(bmp, 0, 0);
    return { w: bmp.width, h: bmp.height, data: ctx.getImageData(0, 0, bmp.width, bmp.height).data };
  }

  test("convert: toPng keeps every decoded pixel of a WebP", async () => {
    const c = new OffscreenCanvas(37, 23);
    const ctx = c.getContext("2d");
    for (let y = 0; y < 23; y++) for (let x = 0; x < 37; x++) {
      ctx.fillStyle = `rgb(${(x * 7) % 256},${(y * 11) % 256},${(x * y) % 256})`;
      ctx.fillRect(x, y, 1, 1);
    }
    const webp = new Uint8Array(await (await c.convertToBlob({ type: "image/webp", quality: 1 })).arrayBuffer());
    ok(C.webpInfo(webp).webp, "the browser made a WebP");
    const png = await C.toPng(webp);
    eq([...png.subarray(0, 8)], [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a], "PNG signature");
    const a = await pixels(webp, "image/webp");
    const b = await pixels(png, "image/png");
    eq([b.w, b.h], [a.w, a.h]);
    let diff = 0;
    for (let i = 0; i < a.data.length; i++) if (a.data[i] !== b.data[i]) diff++;
    eq(diff, 0, "differing channel values");
    const r = await C.maybePng(webp, "x_1.webp");
    eq([r.converted, r.name], [true, "x_1.png"]);
  });

  test("convert: animated WebP, other formats and broken data stay as they are", async () => {
    const anim = riff([["VP8X", [0x02, 0, 0, 0, 0, 0, 0, 0, 0, 0]], ["ANIM", [0, 0, 0, 0, 0, 0]]]);
    eq((await C.maybePng(anim, "a.webp")).converted, false);
    eq((await C.maybePng(anim, "a.webp")).name, "a.webp");
    const notWebp = enc.encode("not an image at all");
    eq((await C.maybePng(notWebp, "a.webp")).bytes, notWebp);
    const broken = riff([["VP8L", [1, 2, 3, 4, 5]]]);
    const r = await C.maybePng(broken, "b.webp");
    eq([r.converted, r.name, r.bytes === broken], [false, "b.webp", true], "undecodable WebP is kept");
  });

  // ---- runner ----------------------------------------------------------------

  async function run() {
    const list = document.getElementById("list");
    let pass = 0;
    let fail = 0;
    for (const t of tests) {
      const li = document.createElement("li");
      try {
        await t.fn();
        pass++;
        li.className = "pass";
        li.textContent = "PASS " + t.name;
      } catch (e) {
        fail++;
        li.className = "fail";
        li.textContent = "FAIL " + t.name;
        const err = document.createElement("div");
        err.className = "err";
        err.textContent = String((e && e.stack) || e);
        li.appendChild(err);
        console.error("FAIL", t.name, e);
      }
      list.appendChild(li);
    }
    const result = document.getElementById("result");
    result.textContent = "PASS " + pass + " / FAIL " + fail;
    result.className = fail ? "fail" : "pass";
  }

  run();
})();
